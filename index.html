<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CineStream IPTV Player</title>
  <!-- HLS.js para reprodução de streams M3U8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- Ícones Phosphor -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    :root {
      --bg-main: #0a0e17;
      --bg-card: #131b2e;
      --bg-card-hover: #1c2742;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent-live: #ef4444;
      --accent-vod: #8b5cf6;
      --accent-series: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --focus-ring: 3px solid #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Foco do Controle Remoto (Android TV / D-Pad) */
    .focusable:focus, .focusable.focused {
      outline: var(--focus-ring) !important;
      transform: scale(1.03);
      transition: transform 0.15s ease, outline 0.15s ease;
      z-index: 10;
    }

    /* Layout Geral */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Barra Superior (Header) */
    header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: linear-gradient(180deg, rgba(19, 27, 46, 0.9) 0%, rgba(10, 14, 23, 0.4) 100%);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand i {
      color: var(--primary);
      font-size: 1.8rem;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .time-display {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Conteúdo Principal */
    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .view.active {
      display: flex;
      opacity: 1;
    }

    /* ========================================================
       TELA INICIAL (DASHBOARD)
    ======================================================== */
    #home-view {
      padding: 30px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      width: 100%;
      max-width: 1100px;
      height: 380px;
    }

    .home-card {
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      transition: all 0.2s;
    }

    .home-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
    }

    .home-card.live::before { background: var(--accent-live); }
    .home-card.vod::before { background: var(--accent-vod); }
    .home-card.series::before { background: var(--accent-series); }

    .home-card i {
      font-size: 4.5rem;
      margin-bottom: 20px;
    }

    .home-card.live i { color: var(--accent-live); }
    .home-card.vod i { color: var(--accent-vod); }
    .home-card.series i { color: var(--accent-series); }

    .home-card h2 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .home-card span {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .home-bottom-bar {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .btn {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    /* ========================================================
       TELA DE CANAIS AO VIVO
    ======================================================== */
    #live-view {
      display: none;
      flex-direction: row;
      height: 100%;
      width: 100%;
    }

    #live-view.active {
      display: flex;
    }

    .sidebar {
      width: 250px;
      background: #0f1523;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .category-list, .channel-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }

    .sidebar-title {
      padding: 15px 20px;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    .category-item, .channel-item {
      padding: 14px 20px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.95rem;
    }

    .category-item.active {
      background: rgba(59, 130, 246, 0.2);
      color: var(--primary);
      border-left: 4px solid var(--primary);
    }

    .channel-column {
      width: 320px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .channel-item {
      justify-content: space-between;
    }

    .channel-item.active {
      background: #1e293b;
      border-left: 4px solid var(--accent-live);
    }

    .channel-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .channel-logo {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: #000;
      object-fit: cover;
    }

    /* Painel do Player */
    .player-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
    }

    .video-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .epg-panel {
      height: 110px;
      background: #0d121f;
      padding: 15px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .epg-current h3 {
      font-size: 1.15rem;
      margin-bottom: 4px;
    }

    .epg-current p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .player-controls {
      display: flex;
      gap: 12px;
    }

    /* ========================================================
       TELA DE VOD (FILMES E SÉRIES)
    ======================================================== */
    .media-view {
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
    }

    .vod-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      padding-top: 15px;
    }

    .media-card {
      background: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      aspect-ratio: 2/3;
      position: relative;
    }

    .media-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .media-card-title {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
      padding: 25px 10px 10px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
    }

    /* Modal de Configurações / M3U */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 24px;
      width: 90%;
      max-width: 500px;
      border: 1px solid var(--border);
    }

    .modal h2 {
      margin-bottom: 15px;
    }

    .modal input[type="text"] {
      width: 100%;
      padding: 12px;
      background: #090d16;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Responsividade */
    @media (max-width: 768px) {
      .cards-grid {
        grid-template-columns: 1fr;
        height: auto;
      }
      #live-view {
        flex-direction: column;
      }
      .sidebar, .channel-column {
        width: 100%;
        max-height: 200px;
      }
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- Header -->
    <header>
      <div class="brand">
        <i class="ph ph-television"></i>
        <span>CINESTREAM</span>
      </div>
      <div class="header-info">
        <div class="time-display" id="time-display">00:00</div>
        <button class="btn focusable" onclick="navigate('home')">
          <i class="ph ph-house"></i> Início
        </button>
      </div>
    </header>

    <!-- Conteúdo -->
    <main>
      <!-- Dashboard Inicial -->
      <section id="home-view" class="view active">
        <div class="cards-grid">
          <div class="home-card live focusable" tabindex="0" onclick="navigate('live')">
            <i class="ph ph-broadcast"></i>
            <h2>TV AO VIVO</h2>
            <span id="live-count">0 canais carregados</span>
          </div>
          <div class="home-card vod focusable" tabindex="0" onclick="navigate('vod')">
            <i class="ph ph-film-strip"></i>
            <h2>FILMES</h2>
            <span id="vod-count">0 títulos</span>
          </div>
          <div class="home-card series focusable" tabindex="0" onclick="navigate('series')">
            <i class="ph ph-popcorn"></i>
            <h2>SÉRIES</h2>
            <span id="series-count">0 temporadas</span>
          </div>
        </div>

        <div class="home-bottom-bar">
          <button class="btn focusable" onclick="openPlaylistModal()">
            <i class="ph ph-playlist"></i> Carregar Lista M3U
          </button>
          <button class="btn focusable" onclick="loadDemoPlaylist()">
            <i class="ph ph-sparkle"></i> Carregar Demonstração
          </button>
        </div>
      </section>

      <!-- TV ao Vivo -->
      <section id="live-view" class="view">
        <div class="sidebar">
          <div class="sidebar-title">Categorias</div>
          <ul class="category-list" id="category-list"></ul>
        </div>
        <div class="channel-column">
          <div class="sidebar-title">Canais</div>
          <ul class="channel-list" id="channel-list"></ul>
        </div>
        <div class="player-column">
          <div class="video-container">
            <video id="player" controls autoplay playsinline></video>
          </div>
          <div class="epg-panel">
            <div class="epg-current">
              <h3 id="current-channel-name">Selecione um Canal</h3>
              <p id="current-channel-group">Ao Vivo</p>
            </div>
            <div class="player-controls">
              <button class="btn focusable" onclick="toggleFullScreen()">
                <i class="ph ph-corners-out"></i> Tela Cheia
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Filmes (VOD) -->
      <section id="vod-view" class="view media-view">
        <h2>Filmes On Demand</h2>
        <div class="vod-grid" id="vod-grid"></div>
      </section>

      <!-- Séries -->
      <section id="series-view" class="view media-view">
        <h2>Séries de TV</h2>
        <div class="vod-grid" id="series-grid"></div>
      </section>
    </main>
  </div>

  <!-- Modal para Configurar Lista M3U -->
  <div class="modal-overlay" id="playlist-modal">
    <div class="modal">
      <h2>Inserir Lista M3U</h2>
      <input type="text" id="m3u-url" placeholder="https://exemplo.com/lista.m3u">
      
      <div style="margin-bottom: 15px;">
        <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Ou selecione um arquivo local:</label>
        <input type="file" id="m3u-file" accept=".m3u,.m3u8">
      </div>

      <div class="modal-actions">
        <button class="btn focusable" onclick="closePlaylistModal()">Cancelar</button>
        <button class="btn focusable" style="background: var(--primary);" onclick="processPlaylistInput()">Carregar</button>
      </div>
    </div>
  </div>

  <script>
    // Estado da Aplicação
    const state = {
      channels: [],
      vod: [],
      series: [],
      categories: new Set(),
      activeCategory: null,
      currentStream: null
    };

    let hls = null;
    const video = document.getElementById('player');

    // Relógio
    function updateClock() {
      const now = new Date();
      document.getElementById('time-display').innerText = 
        now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Navegação entre views
    function navigate(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      const target = document.getElementById(`${viewId}-view`);
      if (target) target.classList.add('active');

      // Se sair da tela de reprodução, pausa o vídeo para economizar recursos
      if (viewId !== 'live' && !video.paused) {
        video.pause();
      }
    }

    // Leitor e Parser de Formato M3U/M3U8
    function parseM3U(content) {
      const lines = content.split('\n');
      const items = [];
      let currentItem = null;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        if (line.startsWith('#EXTINF:')) {
          currentItem = {};
          // Extrair nome
          const titleParts = line.split(',');
          currentItem.name = titleParts.length > 1 ? titleParts.slice(1).join(',').trim() : "Sem Título";

          // Extrair grupo / categoria
          const groupMatch = line.match(/group-title="([^"]+)"/i);
          currentItem.group = groupMatch ? groupMatch[1] : "Geral";

          // Extrair logo
          const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
          currentItem.logo = logoMatch ? logoMatch[1] : "https://via.placeholder.com/60/000/fff?text=TV";
        } else if (line && !line.startsWith('#')) {
          if (currentItem) {
            currentItem.url = line;
            items.push(currentItem);
            currentItem = null;
          }
        }
      }
      return items;
    }

    // Carregar e Distribuir Dados
    function loadPlaylistData(m3uText) {
      const items = parseM3U(m3uText);
      state.channels = [];
      state.vod = [];
      state.series = [];
      state.categories.clear();

      items.forEach(item => {
        const lowerGroup = item.group.toLowerCase();
        const lowerName = item.name.toLowerCase();

        // Categorização heurística para Live, VOD ou Séries
        if (lowerGroup.includes('filme') || lowerGroup.includes('movie') || lowerName.includes('1080p') || item.url.endsWith('.mp4') || item.url.endsWith('.mkv')) {
          state.vod.push(item);
        } else if (lowerGroup.includes('série') || lowerGroup.includes('series') || lowerName.match(/s\d+ *e\d+/i)) {
          state.series.push(item);
        } else {
          state.channels.push(item);
          state.categories.add(item.group);
        }
      });

      // Atualiza contadores
      document.getElementById('live-count').innerText = `${state.channels.length} canais`;
      document.getElementById('vod-count').innerText = `${state.vod.length} títulos`;
      document.getElementById('series-count').innerText = `${state.series.length} títulos`;

      buildLiveView();
      buildVodView();
      buildSeriesView();
    }

    // Renderiza TV Ao Vivo
    function buildLiveView() {
      const catList = document.getElementById('category-list');
      catList.innerHTML = '';

      const categories = ['Todos', ...Array.from(state.categories)];
      categories.forEach((cat, index) => {
        const li = document.createElement('li');
        li.className = `category-item focusable ${index === 0 ? 'active' : ''}`;
        li.tabIndex = 0;
        li.innerHTML = `<i class="ph ph-folder"></i> <span>${cat}</span>`;
        li.onclick = () => {
          document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
          li.classList.add('active');
          renderChannels(cat);
        };
        catList.appendChild(li);
      });

      renderChannels('Todos');
    }

    function renderChannels(category) {
      const chList = document.getElementById('channel-list');
      chList.innerHTML = '';

      const filtered = category === 'Todos' 
        ? state.channels 
        : state.channels.filter(c => c.group === category);

      filtered.forEach((ch, idx) => {
        const li = document.createElement('li');
        li.className = 'channel-item focusable';
        li.tabIndex = 0;
        li.innerHTML = `
          <div class="channel-info">
            <img class="channel-logo" src="${ch.logo}" onerror="this.src='https://via.placeholder.com/60/000/fff?text=TV'" />
            <span>${ch.name}</span>
          </div>
          <i class="ph ph-play-circle" style="font-size: 1.2rem; color: var(--text-muted)"></i>
        `;
        li.onclick = () => playStream(ch);
        chList.appendChild(li);
      });
    }

    // Player de Vídeo com HLS
    function playStream(item) {
      document.getElementById('current-channel-name').innerText = item.name;
      document.getElementById('current-channel-group').innerText = item.group;

      if (Hls.isSupported() && (item.url.includes('.m3u8') || !item.url.endsWith('.mp4'))) {
        if (hls) hls.destroy();
        hls = new Hls({ enableWorker: true });
        hls.loadSource(item.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) console.error("Erro HLS:", data);
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Suporte Nativo (Safari e TVs WebOS / Tizen antigas)
        video.src = item.url;
        video.play();
      } else {
        video.src = item.url;
        video.play();
      }
    }

    // Renderiza Filmes e Séries
    function buildVodView() {
      const grid = document.getElementById('vod-grid');
      grid.innerHTML = '';
      state.vod.slice(0, 100).forEach(item => {
        const card = document.createElement('div');
        card.className = 'media-card focusable';
        card.tabIndex = 0;
        card.innerHTML = `
          <img src="${item.logo}" on
